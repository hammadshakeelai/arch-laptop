[sdl]
fullscreen=false
fulldouble=false
fullresolution=original
windowresolution=1280x800
output=opengl
autolock=true
sensitivity=100
waitonerror=true
priority=higher,normal
mapperfile=mapper-0.74-3.map
usescancodes=true

[dosbox]
language=
machine=svga_s3
captures=capture
memsize=16

[render]
frameskip=0
aspect=true
scaler=normal2x

[cpu]
core=auto
cputype=auto
cycles=auto
cycleup=10
cycledown=20

[mixer]
nosound=false
rate=44100
blocksize=1024
prebuffer=25

[autoexec]
mount c ~/assembly
c:
path c:\bin;%PATH%
cls
echo ========================================================
echo  8086 Assembly Workspace Ready (NASM + AFD)
echo ========================================================
